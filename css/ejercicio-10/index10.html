<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ejercicio 10 - Pseudoclases</title>

    <link rel="stylesheet" href="styles10.css">
</head>

<body>

    <h1 id="inicio">Pseudoclases CSS</h1>

    <h2>Menú de navegación</h2>

    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#productos">Productos</a>
        <a href="#servicios">Servicios</a>
        <a href="#contacto">Contacto</a>
    </nav>

    <h2 id="servicios">Servicios</h2>
    <p>Ofrecemos soporte técnico, diseño y mantenimiento.</p>

    <h2 id="contacto">Formulario de contacto</h2>

    <form>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre">

        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo">

        <button type="submit">Enviar</button>

    </form>


    <h2 id="productos">Lista de productos</h2>

    <ul>
        <li>Computador portátil</li>
        <li>Teléfono inteligente</li>
        <li>Teclado</li>
        <li>Mouse</li>
        <li>Monitor</li>
    </ul>

</body>

</html>
